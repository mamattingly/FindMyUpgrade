name: Advisor tests and live smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Run backend unit tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for this version to reach Render
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
          EXPECTED_VERSION: "0.8.0"
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["APP_URL"].rstrip("/") + "/api/health"
          expected = os.environ["EXPECTED_VERSION"]
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  version = payload.get("app_version")
                  print("Render health:", payload)
                  if version == expected:
                      print("Expected app version is live.")
                      break
              except Exception as exc:
                  print("Waiting for Render:", str(exc))
              time.sleep(5)
          else:
              raise SystemExit(f"Render did not report app_version={expected} within five minutes.")
          PY
      - name: Verify Thottbot Forever dungeon and item API
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ["APP_URL"].rstrip("/") + "/api/thottbot-diagnostics?ids=7713,7711,281290,19019,274291,274292,274155"
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          if payload.get("dungeons_http_status") != 200 or not payload.get("dungeon_count"):
              raise SystemExit("Thottbot Forever dungeon catalog was not returned.")
          items = payload.get("item_samples") or []
          if not any(x.get("http_status") == 200 and x.get("name") and x.get("item_sample") for x in items):
              raise SystemExit("Thottbot Forever did not return a usable item record.")
          zones = payload.get("zone_samples") or []
          if not any(x.get("http_status") == 200 for x in zones):
              raise SystemExit("Thottbot Forever did not return a dungeon zone loot table.")
          PY
      - name: Probe WarcraftDB Forever tooltip data (optional source)
        continue-on-error: true
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"ids": "7711,7713,7714,281290,274291"})
          url = os.environ["APP_URL"].rstrip("/") + "/api/warcraftdb-diagnostics?" + query
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          items = payload.get("items") or []
          if not any(x.get("parsed") and x.get("name") and x.get("stats") for x in items):
              raise SystemExit("WarcraftDB did not return a parsed Forever item tooltip with stats.")
          PY
      - name: Probe Wowhead Forever tooltip API (optional source)
        continue-on-error: true
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"ids": "7711,7713,7714"})
          url = os.environ["APP_URL"].rstrip("/") + "/api/wowhead-tooltip-diagnostics?" + query
          with urllib.request.urlopen(url, timeout=90) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          items = payload.get("items") or []
          if not any(x.get("parsed") and x.get("name") and x.get("stats") for x in items):
              raise SystemExit("Wowhead Forever tooltip API did not return parsed item stats.")
          PY
      - name: Probe Blizzard item namespaces for legacy gear data
        continue-on-error: true
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"ids": "7711,7713,7714,281290"})
          url = os.environ["APP_URL"].rstrip("/") + "/api/static-namespace-diagnostics?" + query
          with urllib.request.urlopen(url, timeout=90) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          matches = [variant for item in payload.get("items", [])
                     for variant in item.get("variants", [])
                     if variant.get("http_status") == 200 and variant.get("stats")]
          if not matches:
              raise SystemExit("No Blizzard static namespace returned legacy item stats.")
          PY
      - name: Verify live character scan and dungeon analysis
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          url = os.environ["APP_URL"].rstrip("/") + "/api/scan"
          body = json.dumps({"region": "us", "name": "Faith Heal"}).encode()
          request = urllib.request.Request(url, data=body,
              headers={"Content-Type": "application/json"}, method="POST")
          scan_started = time.perf_counter()
          with urllib.request.urlopen(request, timeout=180) as response:
              payload = json.load(response)
          scan_seconds = round(time.perf_counter() - scan_started, 2)
          print("Character scan seconds:", scan_seconds)
          print(json.dumps({
              "character": payload.get("character"),
              "gear_count": len(payload.get("equipped_gear") or []),
              "unknown_gear_names": [x.get("slot") for x in payload.get("equipped_gear", [])
                                     if not x.get("name") or x.get("name") == "Unknown item"],
              "dungeon_recommendations": payload.get("dungeon_recommendations"),
          }, indent=2))
          gear = payload.get("equipped_gear") or []
          if len(gear) < 10:
              raise SystemExit("Live scan did not return the expected equipped gear.")
          if any(not x.get("name") or x.get("name") == "Unknown item" for x in gear):
              raise SystemExit("At least one equipped item name is still unknown.")
          analysis = payload.get("dungeon_recommendations") or {}
          if analysis.get("status") not in ("ready", "partial_data", "no_upgrades_found"):
              raise SystemExit("Dungeon analysis did not complete with usable item data.")
          if not analysis.get("dungeons_checked") or not analysis.get("items_evaluated"):
              raise SystemExit("Dungeon analysis did not evaluate any sourced loot.")
          upgrades = [u for dungeon in (analysis.get("rankings") or [])
                      for u in (dungeon.get("upgrades") or [])]
          if not any(u.get("name") == "Illusionary Rod" for u in upgrades):
              raise SystemExit("Expected Scarlet Monastery Library's Illusionary Rod upgrade was not recognized.")
          if not analysis.get("recommended") or not analysis.get("rankings"):
              raise SystemExit("Live scan did not produce a best-dungeon recommendation.")
          item_ids = sorted({str(x.get("id")) for x in gear if x.get("id")} |
                            {str(u.get("item_id")) for dungeon in (analysis.get("rankings") or [])[:1]
                             for u in (dungeon.get("upgrades") or []) if u.get("item_id")})
          icon_url = os.environ["APP_URL"].rstrip("/") + "/api/item-icons?" + urllib.parse.urlencode({"ids": ",".join(item_ids)})
          icon_started = time.perf_counter()
          with urllib.request.urlopen(icon_url, timeout=90) as response:
              icon_payload = json.load(response)
          print("Deferred icon fetch seconds:", round(time.perf_counter() - icon_started, 2))
          icons = icon_payload.get("icons") or {}
          if not any(str(x.get("id")) in icons for x in gear):
              raise SystemExit("Deferred item artwork did not return an equipped item icon.")
          if not any(str(u.get("item_id")) in icons for dungeon in (analysis.get("rankings") or [])[:1]
                     for u in (dungeon.get("upgrades") or [])):
              raise SystemExit("Deferred item artwork did not return a recommended item icon.")
          PY
