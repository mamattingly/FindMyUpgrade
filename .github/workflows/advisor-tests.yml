name: Advisor tests and live smoke check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Run backend unit tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe external Forever Armory 3D profile embed support
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url = "https://armorywowforever.com/c/forever/us/pvp/Grandpa-Fetus"
          request = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml",
          })
          with urllib.request.urlopen(request, timeout=35) as response:
              html = response.read().decode("utf-8", "replace")
              headers = response.headers
              print("Armory profile HTTP status:", response.status)
              print("Armory final URL:", response.geturl())
              print("Armory frame headers:", json.dumps({
                  "x-frame-options": headers.get("X-Frame-Options"),
                  "content-security-policy": headers.get("Content-Security-Policy"),
                  "content-type": headers.get("Content-Type"),
              }, indent=2))
              print("Armory page size:", len(html))
              print("Armory 3D markers:", {
                  "canvas": html.count("<canvas"),
                  "viewer": len(re.findall(r"viewer|modelviewer|3d", html, re.I)),
                  "script_sources": re.findall(r'<script[^>]+src="([^"]+)', html)[:30],
                  "iframe_sources": re.findall(r'<iframe[^>]+src="([^"]+)', html)[:10],
              })
              open("/tmp/forever-armory-profile.html", "w").write(html)
          PY
      - name: Inspect Armory page after browser-side JavaScript runs
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python - <<'PY'
          import json, re, urllib.request
          from playwright.sync_api import sync_playwright
          url = "https://armorywowforever.com/c/forever/us/pvp/Grandpa-Fetus"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              failed = []
              console_errors = []
              relevant_responses = []
              page.on("requestfailed", lambda req: failed.append({
                  "url": req.url[:300], "error": req.failure
              }) if any(x in req.url.lower() for x in ("model", "viewer", "wow", "three", "chunk")) else None)
              page.on("console", lambda msg: console_errors.append(msg.text[:500])
                  if msg.type == "error" else None)
              page.on("response", lambda res: relevant_responses.append({
                  "status": res.status, "url": res.url[:300],
                  "type": res.headers.get("content-type", "")
              }) if any(x in res.url.lower() for x in ("model", "viewer", "wow", "three", "chunk", "asset")) else None)
              response = page.goto(url, wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(12000)
              info = page.evaluate("""() => ({
                title: document.title,
                url: location.href,
                bodyText: (document.body?.innerText || "").slice(0, 2500),
                canvases: [...document.querySelectorAll("canvas")].map(c => ({
                  width:c.width,height:c.height,className:c.className,id:c.id,
                  webgl:!!(c.getContext("webgl2")||c.getContext("webgl")||c.getContext("2d"))
                })),
                iframes:[...document.querySelectorAll("iframe")].map(x=>x.src),
                scripts:[...document.scripts].map(x=>x.src||"inline").filter(Boolean),
                preloadLinks:[...document.querySelectorAll('link[rel="modulepreload"],link[rel="preload"],link[rel="stylesheet"]')].map(x=>x.href).slice(0,80),
                globals:Object.keys(window).filter(k=>/model|viewer|wow|three|armory|character/i.test(k)).slice(0,100),
                htmlHas3d:/canvas|webgl|modelviewer|zamm|3d-model/i.test(document.documentElement.outerHTML)
              })""")
              print("Armory browser HTTP:", response.status if response else None)
              print("Armory browser inspection:", json.dumps(info, indent=2)[:20000])
              print("Relevant browser responses:", json.dumps(relevant_responses[:100], indent=2)[:12000])
              print("Relevant failed requests:", json.dumps(failed[:50], indent=2)[:7000])
              print("Browser console errors:", json.dumps(console_errors[:30], indent=2)[:5000])
              deep = page.evaluate("""() => {
                const c=document.querySelector("canvas");
                const scripts=[...document.scripts].map((s,i)=>({
                  index:i,src:s.src||null,type:s.type||"",text:(s.textContent||"").slice(0,12000)
                })).filter(x=>x.text && /ZamModelViewer|generateModels|CONTENT_PATH|classicplus|character/i.test(x.text));
                const w=window.ZamModelViewer;
                return {
                  canvasParent:c?.parentElement?.parentElement?.outerHTML?.slice(0,6000)||null,
                  canvasStyle:c?{display:getComputedStyle(c).display,visibility:getComputedStyle(c).visibility,width:getComputedStyle(c).width,height:getComputedStyle(c).height}:null,
                  viewerGlobals:w?Object.keys(w):[],
                  viewerPrototype:w?Object.getOwnPropertyNames(w.prototype||{}):[],
                  scriptSnippets:scripts.map(x=>({index:x.index,src:x.src,type:x.type,text:x.text.slice(-9000)})),
                  globals:Object.keys(window).filter(k=>/model|viewer|character/i.test(k)).slice(0,100)
                }
              }""")
              print("Armory deep viewer init:", json.dumps(deep, indent=2)[:24000])
              viewer_url="https://armorywowforever.com/modelviewer/classicplus/deployment/viewer/35ee72d/viewer.min.js"
              with urllib.request.urlopen(viewer_url, timeout=45) as response:
                  viewer_js=response.read().decode("utf-8","replace")
              print("Armory viewer deployment:", {
                  "bytes":len(viewer_js),
                  "hasClassicPlus":"classicplus" in viewer_js.lower(),
                  "hasM2":".m2" in viewer_js.lower(),
                  "hasMO3":".mo3" in viewer_js.lower(),
                  "hasZamModelViewer":"ZamModelViewer" in viewer_js,
              })
              for marker in ("ZamModelViewer","classicplus","meta/character","charactercustomization","modelviewer/v2"):
                  pos=viewer_js.find(marker)
                  if pos>=0:
                      print("Armory viewer marker",marker,viewer_js[max(0,pos-900):pos+1800])
              for asset in ("meta/character/1.json","meta/charactercustomization/1.json"):
                  asset_url="https://armorywowforever.com/modelviewer/v2/classicplus/"+asset
                  try:
                      with urllib.request.urlopen(asset_url,timeout=30) as response:
                          body=response.read()
                          if asset.endswith(".json"):
                              data=json.loads(body)
                              print("Armory viewer data",asset,json.dumps(data,indent=2)[:9000])
                  except Exception as exc:
                      print("Armory viewer data error",asset,type(exc).__name__,str(exc)[:300])

              browser.close()
          PY
      - name: Probe Wago Forever mesh files by FileDataID
        run: |
          python - <<'PY'
          import json, urllib.request
          build = "1.60.1.70938"
          file_ids = [974343, 143302, 143601, 147521, 151192, 152252, 148842]
          rows = []
          for file_id in file_ids:
              url = f"https://wago.tools/api/casc/{file_id}?version={build}"
              request = urllib.request.Request(url, headers={
                  "User-Agent": "WoW-Forever-Dungeon-Advisor/mesh-diagnostic",
                  "Accept": "*/*",
              })
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      rows.append({
                          "fileDataId": file_id, "status": response.status,
                          "bytes": len(body), "magic": body[:16].hex(),
                          "ascii": body[:8].decode("ascii", "replace"),
                          "contentType": response.headers.get("Content-Type"),
                      })
              except Exception as exc:
                  rows.append({"fileDataId": file_id, "error": type(exc).__name__,
                               "detail": str(exc)[:300]})
          print("Wago CASC raw Forever files:", json.dumps(rows, indent=2))
          PY
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for this version to reach Render
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
          EXPECTED_VERSION: "0.9.2"
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["APP_URL"].rstrip("/") + "/api/health"
          expected = os.environ["EXPECTED_VERSION"]
          for attempt in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      payload = json.load(response)
                  version = payload.get("app_version")
                  print("Render health:", payload)
                  if version == expected:
                      print("Expected app version is live.")
                      break
              except Exception as exc:
                  print("Waiting for Render:", str(exc))
              time.sleep(5)
          else:
              raise SystemExit(f"Render did not report app_version={expected} within five minutes.")
          PY
      - name: Verify Thottbot Forever dungeon and item API
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ["APP_URL"].rstrip("/") + "/api/thottbot-diagnostics?ids=7713,7711,281290,19019,274291,274292,274155"
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          if payload.get("dungeons_http_status") != 200 or not payload.get("dungeon_count"):
              raise SystemExit("Thottbot Forever dungeon catalog was not returned.")
          items = payload.get("item_samples") or []
          if not any(x.get("http_status") == 200 and x.get("name") and x.get("item_sample") for x in items):
              raise SystemExit("Thottbot Forever did not return a usable item record.")
          zones = payload.get("zone_samples") or []
          if not any(x.get("http_status") == 200 for x in zones):
              raise SystemExit("Thottbot Forever did not return a dungeon zone loot table.")
          PY
      - name: Probe WarcraftDB Forever tooltip data (optional source)
        continue-on-error: true
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"ids": "7711,7713,7714,281290,274291"})
          url = os.environ["APP_URL"].rstrip("/") + "/api/warcraftdb-diagnostics?" + query
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          items = payload.get("items") or []
          if not any(x.get("parsed") and x.get("name") and x.get("stats") for x in items):
              raise SystemExit("WarcraftDB did not return a parsed Forever item tooltip with stats.")
          PY
      - name: Probe Wowhead Forever tooltip API (optional source)
        continue-on-error: true
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"ids": "7711,7713,7714"})
          url = os.environ["APP_URL"].rstrip("/") + "/api/wowhead-tooltip-diagnostics?" + query
          with urllib.request.urlopen(url, timeout=90) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          items = payload.get("items") or []
          if not any(x.get("parsed") and x.get("name") and x.get("stats") for x in items):
              raise SystemExit("Wowhead Forever tooltip API did not return parsed item stats.")
          PY
      - name: Probe Blizzard item namespaces for legacy gear data
        continue-on-error: true
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"ids": "7711,7713,7714,281290"})
          url = os.environ["APP_URL"].rstrip("/") + "/api/static-namespace-diagnostics?" + query
          with urllib.request.urlopen(url, timeout=90) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          matches = [variant for item in payload.get("items", [])
                     for variant in item.get("variants", [])
                     if variant.get("http_status") == 200 and variant.get("stats")]
          if not matches:
              raise SystemExit("No Blizzard static namespace returned legacy item stats.")
          PY
      - name: Verify live character scan and dungeon analysis
        env:
          APP_URL: https://wow-forever-dungeon-advisor-1zlg.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          url = os.environ["APP_URL"].rstrip("/") + "/api/scan"
          body = json.dumps({"region": "us", "name": "Faith Heal"}).encode()
          request = urllib.request.Request(url, data=body,
              headers={"Content-Type": "application/json"}, method="POST")
          scan_started = time.perf_counter()
          with urllib.request.urlopen(request, timeout=180) as response:
              payload = json.load(response)
          scan_seconds = round(time.perf_counter() - scan_started, 2)
          print("Character scan seconds:", scan_seconds)
          print(json.dumps({
              "character": payload.get("character"),
              "gear_count": len(payload.get("equipped_gear") or []),
              "unknown_gear_names": [x.get("slot") for x in payload.get("equipped_gear", [])
                                     if not x.get("name") or x.get("name") == "Unknown item"],
              "dungeon_recommendations": payload.get("dungeon_recommendations"),
          }, indent=2))
          model = payload.get("model_data") or {}
          print("Armory model data:", json.dumps({
              "race": model.get("race"), "gender": model.get("gender"),
              "customizations": len(model.get("customizations") or []),
              "visible_items": len(model.get("items") or []),
              "missing_display_ids": model.get("missing_display_ids"),
              "resolved_appearances": model.get("resolved_appearances"),
              "display_fallback_debug": model.get("display_fallback_debug"),
              "wago_db2": model.get("wago_db2"),
              "armory_render_url": payload.get("armory_render_url"),
          }, indent=2))
          if not model.get("race") or model.get("gender") not in (0, 1):
              raise SystemExit("Forever appearance API did not provide usable race/gender data.")
          if len(model.get("items") or []) < 5:
              raise SystemExit("Fewer than five equipped item display IDs resolved for the 3D model.")
          base = os.environ["APP_URL"].rstrip("/")
          viewer_url = base + "/api/modelviewer/live/viewer/viewer.min.js"
          with urllib.request.urlopen(viewer_url, timeout=90) as response:
              viewer_bytes = response.read()
          if len(viewer_bytes) < 10000:
              raise SystemExit("Live 3D viewer script did not load through the asset proxy.")

          race, gender = int(model["race"]), int(model["gender"])
          character_id = race * 2 - 1 + gender
          required_assets = [
              "live/meta/charactercustomization/" + str(character_id) + ".json",
              f"live/meta/character/{character_id}.json",
              f"live/meta/charactercustomization2/{race}_{gender}.json",
          ]
          slot_paths = {
              3: "armor/3/20715.json", 4: "armor/4/8370.json",
              5: "armor/5/8857.json", 6: "armor/6/11172.json",
              7: "armor/7/8420.json", 8: "armor/8/4622.json",
              9: "armor/9/3382.json", 10: "armor/10/27753.json",
              15: "armor/15/27752.json", 18: "armor/18/21024.json",
              21: "armor/21/5554.json",
          }
          required_assets += ["live/meta/" + path for path in slot_paths.values()]
          model_asset_checks, metadata_documents = [], {}
          for asset in required_assets:
              asset_url = base + "/api/modelviewer/" + asset
              try:
                  with urllib.request.urlopen(asset_url, timeout=35) as response:
                      data = response.read()
                      entry = {
                          "path": asset, "status": response.status,
                          "bytes": len(data), "content_type": response.headers.get("Content-Type")
                      }
                      if asset.endswith(".json"):
                          document = json.loads(data)
                          metadata_documents[asset] = document
                          entry["top_keys"] = list(document.keys())[:50] if isinstance(document, dict) else []
                      model_asset_checks.append(entry)
              except urllib.error.HTTPError as exc:
                  model_asset_checks.append({"path": asset, "status": exc.code})
              except Exception as exc:
                  model_asset_checks.append({"path": asset, "error": type(exc).__name__})

          # The renderer requests the model's base ID directly, but for
          # equipment it resolves ModelFiles[<key>][n].FileDataId. The key
          # itself is NOT the .mo3 filename.
          mo3_ids = set()
          def add_mo3_id(value):
              try:
                  number = int(value)
                  if number > 0:
                      mo3_ids.add(number)
              except (TypeError, ValueError):
                  pass

          for document in metadata_documents.values():
              if not isinstance(document, dict):
                  continue
              # Character metadata's Model field is the base character .mo3.
              add_mo3_id(document.get("Model"))
              model_files = document.get("ModelFiles") or {}
              if isinstance(model_files, dict):
                  for records in model_files.values():
                      if isinstance(records, dict):
                          records = [records]
                      for record in records if isinstance(records, list) else []:
                          if isinstance(record, dict):
                              add_mo3_id(record.get("FileDataId"))

          mo3_checks = []
          for model_id in sorted(mo3_ids)[:60]:
              path = f"live/mo3/{model_id}.mo3"
              url = base + "/api/modelviewer/" + path
              try:
                  with urllib.request.urlopen(url, timeout=35) as response:
                      data = response.read()
                      mo3_checks.append({"path": path, "status": response.status, "bytes": len(data)})
              except urllib.error.HTTPError as exc:
                  mo3_checks.append({"path": path, "status": exc.code})
              except Exception as exc:
                  mo3_checks.append({"path": path, "error": type(exc).__name__})

          character_doc = metadata_documents.get(f"live/meta/character/{character_id}.json") or {}
          print("Character model IDs and gender:",
              json.dumps({key: character_doc.get(key) for key in
                          ("Model", "Race", "Gender", "Character", "ComponentModels", "ModelFiles")}, indent=2)[:5000])
          customization_paths = [
              f"live/meta/charactercustomization2/{race}_{gender}.json",
              f"live/meta/charactercustomization2/{character_doc.get('Race')}_{character_doc.get('Gender')}.json",
              f"live/meta/charactercustomization2/{character_id}.json",
          ]
          customization_checks = []
          for path in dict.fromkeys(customization_paths):
              url = base + "/api/modelviewer/" + path
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = response.read()
                      customization_checks.append({"path": path, "status": response.status,
                          "bytes": len(payload), "top_keys": list(json.loads(payload).keys())[:30]})
              except urllib.error.HTTPError as exc:
                  customization_checks.append({"path": path, "status": exc.code})
              except Exception as exc:
                  customization_checks.append({"path": path, "error": type(exc).__name__})

          def model_refs(value, path="$", out=None, depth=0):
              if out is None:
                  out = []
              if depth > 8 or len(out) >= 80:
                  return out
              if isinstance(value, dict):
                  for key, child in value.items():
                      key_text = str(key)
                      lowered = key_text.casefold()
                      if any(term in lowered for term in ("model", "display", "file", "skeleton", "creature")):
                          if isinstance(child, (str, int, float)) and child not in (0, "0", ""):
                              out.append({"path": path + "." + key_text, "value": child})
                          elif isinstance(child, dict):
                              out.append({"path": path + "." + key_text, "keys": list(child.keys())[:20]})
                      if isinstance(child, (dict, list)):
                          model_refs(child, path + "." + key_text, out, depth + 1)
              elif isinstance(value, list):
                  for index, child in enumerate(value[:500]):
                      if isinstance(child, (dict, list)):
                          model_refs(child, path + "[" + str(index) + "]", out, depth + 1)
              return out
          print("Live model asset path probes:", json.dumps(model_asset_checks, indent=2))
          print("Live derived MO3 probes:", json.dumps(mo3_checks, indent=2))
          print("Live character/item model refs:", json.dumps({
              path: model_refs(doc) for path, doc in metadata_documents.items()
          }, indent=2)[:16000])

          gear = payload.get("equipped_gear") or []
          if len(gear) < 10:
              raise SystemExit("Live scan did not return the expected equipped gear.")
          if any(not x.get("name") or x.get("name") == "Unknown item" for x in gear):
              raise SystemExit("At least one equipped item name is still unknown.")
          analysis = payload.get("dungeon_recommendations") or {}
          if analysis.get("status") not in ("ready", "partial_data", "no_upgrades_found"):
              raise SystemExit("Dungeon analysis did not complete with usable item data.")
          if not analysis.get("dungeons_checked") or not analysis.get("items_evaluated"):
              raise SystemExit("Dungeon analysis did not evaluate any sourced loot.")
          upgrades = [u for dungeon in (analysis.get("rankings") or [])
                      for u in (dungeon.get("upgrades") or [])]
          if not any(u.get("name") == "Illusionary Rod" for u in upgrades):
              raise SystemExit("Expected Scarlet Monastery Library's Illusionary Rod upgrade was not recognized.")
          if not analysis.get("recommended") or not analysis.get("rankings"):
              raise SystemExit("Live scan did not produce a best-dungeon recommendation.")
          item_ids = sorted({str(x.get("id")) for x in gear if x.get("id")} |
                            {str(u.get("item_id")) for dungeon in (analysis.get("rankings") or [])[:1]
                             for u in (dungeon.get("upgrades") or []) if u.get("item_id")})
          icon_url = os.environ["APP_URL"].rstrip("/") + "/api/item-icons?" + urllib.parse.urlencode({"ids": ",".join(item_ids)})
          icon_started = time.perf_counter()
          with urllib.request.urlopen(icon_url, timeout=90) as response:
              icon_payload = json.load(response)
          print("Deferred icon fetch seconds:", round(time.perf_counter() - icon_started, 2))
          icons = icon_payload.get("icons") or {}
          if not any(str(x.get("id")) in icons for x in gear):
              raise SystemExit("Deferred item artwork did not return an equipped item icon.")
          if not any(str(u.get("item_id")) in icons for dungeon in (analysis.get("rankings") or [])[:1]
                     for u in (dungeon.get("upgrades") or [])):
              raise SystemExit("Deferred item artwork did not return a recommended item icon.")
          PY
